<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - BadStore</title>

    <link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dvsva8hxi/image/upload/v1794492754/b6ed47bf0e27d8a3e156e487d5f5b255_hbr16j.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { 
            background-image: url('https://res.cloudinary.com/dvsva8hxi/image/upload/v1794496554/f9f8fac14f5405772749bf33b55507e0_vv72wy.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .card { 
            width: 100%; 
            max-width: 400px; 
            padding: 36px 32px; 
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.12));
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-top: 1.5px solid rgba(255, 255, 255, 0.75);
            border-left: 1.5px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            color: #ffffff;
        }

        .brand-title { 
            color: #ffffff; 
            font-weight: 800; 
            letter-spacing: -0.5px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .login-subtitle {
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            font-size: 1.05rem;
        }

        .form-label {
            color: rgba(255, 255, 255, 0.95);
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 6px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.38);
            border-radius: 14px;
            padding: 11px 15px;
            color: #ffffff;
            font-weight: 500;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-color 0.25s ease,
                        border-color 0.25s ease,
                        box-shadow 0.25s ease;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.65);
            font-weight: 400;
        }

        .form-control:hover {
            background-color: rgba(255, 255, 255, 0.28);
            border-color: rgba(255, 255, 255, 0.75);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.95);
            color: #111827;
            border: 2px solid #3b82f6;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.35),
                        0 10px 24px rgba(0, 0, 0, 0.25);
            outline: none;
        }

        .form-control:focus::placeholder {
            color: #6b7280;
        }

        .btn-primary {
            position: relative;
            overflow: hidden;
            background: rgba(59, 130, 246, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.6);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-color 0.25s ease,
                        box-shadow 0.25s ease;
        }

        .btn-primary::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(
                120deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            transition: left 0.55s ease;
        }

        .btn-primary:hover {
            background: rgba(59, 130, 246, 0.95);
            border-color: rgba(255, 255, 255, 0.85);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 26px rgba(37, 99, 235, 0.5), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.8);
        }

        .btn-primary:hover::before {
            left: 130%;
        }

        .btn-primary:active {
            transform: translateY(1px) scale(0.97);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.35);
        }

        .register-text {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            font-size: 0.92rem;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .register-link {
            display: inline-block;
            margin-left: 6px;
            padding: 4px 12px;
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.45);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-color 0.25s ease,
                        box-shadow 0.25s ease;
        }

        .register-link:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.35);
            border-color: rgba(255, 255, 255, 0.75);
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.65);
        }

        .register-link:active {
            transform: translateY(0) scale(0.96);
        }

        #toast-container {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: top 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
        }

        #toast-container.show {
            top: 30px;
        }

        .toast-success {
            background: rgba(34, 197, 94, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .toast-error {
            background: rgba(239, 68, 68, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .toast-icon {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

<div id="toast-container">
    <i id="toast-icon" class="bi bi-check-circle-fill toast-icon"></i>
    <span id="toast-message">Message here</span>
</div>

<div class="card">
    <h2 class="text-center mb-4 brand-title">BadStore</h2>
    <h5 class="text-center mb-4 login-subtitle">Tạo tài khoản</h5>

    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label">Tên</label>
            <input type="text" class="form-control" id="userName" required placeholder="Nhập họ tên của bạn">
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="userEmail" required placeholder="Nhập địa chỉ email">
        </div>
        <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input type="password" class="form-control" id="password" required placeholder="Tạo mật khẩu">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Đăng ký</button>
        <p class="text-center mt-3 mb-0 register-text">
            Đã có tài khoản? <a href="login.html" class="register-link">Đăng nhập</a>
        </p>
    </form>
</div>

<script>
    function showToast(message, type) {
        const container = document.getElementById('toast-container');
        const icon = document.getElementById('toast-icon');
        const msgText = document.getElementById('toast-message');

        msgText.innerText = message;
        container.className = ''; 
        
        if (type === 'success') {
            container.classList.add('toast-success');
            icon.className = 'bi bi-check-circle-fill toast-icon';
        } else {
            container.classList.add('toast-error');
            icon.className = 'bi bi-x-circle-fill toast-icon';
        }

        setTimeout(() => {
            container.classList.add('show');
        }, 10);

        setTimeout(() => {
            container.classList.remove('show');
        }, 3000);
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const userData = {
            userName: document.getElementById('userName').value,
            userEmail: document.getElementById('userEmail').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('http://localhost:8080/user/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            });

            if (response.ok) {
                showToast('Đăng ký thành công! Vui lòng đăng nhập.', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } else {
                showToast('Đăng ký thất bại. Email này có thể đã được sử dụng.', 'error');
            }
        } catch (error) {
            showToast('Lỗi máy chủ. Hãy chắc chắn Spring Boot đang chạy!', 'error');
        }
    });
</script>
</body>
</html>
