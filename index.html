<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BadStore - Cửa hàng cầu lông</title>
    
    <link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dvsva8hxi/image/upload/v1794492754/b6ed47bf0e27d8a3e156e487d5f5b255_hbr16j.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { background-image: url('https://res.cloudinary.com/dvsva8hxi/image/upload/v1794496554/f9f8fac14f5405772749bf33b55507e0_vv72wy.jpg'); background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #ffffff; min-height: 100vh; transition: background-color 0.5s ease; }
        body.dark-mode { background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.85)), url('https://res.cloudinary.com/dvsva8hxi/image/upload/v1794496554/f9f8fac14f5405772749bf33b55507e0_vv72wy.jpg'); }

        .navbar { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-bottom: 1px solid rgba(255, 255, 255, 0.3); padding: 15px 0; position: sticky; top: 0; z-index: 1000; transition: all 0.5s ease; }
        body.dark-mode .navbar { background: rgba(0, 0, 0, 0.5); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .navbar-brand { color: #ffffff !important; font-weight: 800; font-size: 1.6rem; letter-spacing: -0.5px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        
        .search-bar { background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 20px; color: #fff; padding: 8px 15px; width: 250px; transition: all 0.3s ease; }
        body.dark-mode .search-bar { background: rgba(0, 0, 0, 0.4); border-color: rgba(255, 255, 255, 0.2); }
        .search-bar::placeholder { color: rgba(255, 255, 255, 0.7); }
        .search-bar:focus { background: rgba(255, 255, 255, 0.9); color: #111; outline: none; }

        /* Shared Cart Styles */
        .cart-container { position: relative; display: inline-block; }
        .cart-btn { background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.4); color: white; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; position: relative; transition: all 0.3s ease; }
        body.dark-mode .cart-btn { background: rgba(0, 0, 0, 0.4); border-color: rgba(255, 255, 255, 0.2); }
        .cart-btn:hover { background: rgba(255, 255, 255, 0.4); color: white; transform: scale(1.05); }
        .cart-badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border-radius: 50%; font-size: 0.75rem; font-weight: bold; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.8); }
        .cart-dropdown { position: absolute; top: 55px; right: 0; width: 360px; background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 20px; padding: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); opacity: 0; visibility: hidden; transform: translateY(10px); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 1001; text-align: left; }
        .cart-container:hover .cart-dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
        body.dark-mode .cart-dropdown { background: rgba(10, 10, 10, 0.98); }
        .cart-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .cart-item-left { display: flex; align-items: center; gap: 10px; flex-grow: 1; max-width: 55%; }
        .cart-item-img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
        .cart-item-title { font-size: 0.85rem; font-weight: 600; margin: 0; color: white; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .cart-item-price { font-size: 0.8rem; color: #4ade80; margin: 0; font-weight: bold; }
        .cart-item-variant { font-size: 0.75rem; color: rgba(255,255,255,0.6); margin: 0; }
        .qty-controls { display: flex; align-items: center; gap: 5px; }
        .qty-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; border-radius: 5px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; padding: 0; transition: 0.2s; }
        .qty-btn:hover { background: rgba(255,255,255,0.3); }
        .qty-display { width: 20px; text-align: center; font-size: 0.9rem; font-weight: bold; }
        .btn-remove-item { background: transparent; border: none; color: #ef4444; font-size: 1.1rem; padding: 0 5px; transition: 0.2s; }
        .btn-remove-item:hover { color: #ff8a8a; transform: scale(1.1); }

        .view-toggle { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 12px; padding: 4px; display: flex; gap: 4px; backdrop-filter: blur(10px); }
        body.dark-mode .view-toggle { background: rgba(0, 0, 0, 0.4); border-color: rgba(255, 255, 255, 0.2); }
        .view-toggle button { background: transparent; border: none; color: rgba(255, 255, 255, 0.6); padding: 6px 12px; border-radius: 8px; transition: all 0.3s ease; font-size: 1.1rem; }
        .view-toggle button.active { background: rgba(255, 255, 255, 0.3); color: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

        .card { background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.1)); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 20px; color: white; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); overflow: hidden; height: 100%; cursor: pointer; }
        body.dark-mode .card { background: linear-gradient(135deg, rgba(40, 40, 40, 0.9), rgba(20, 20, 20, 0.8)); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 40px rgba(0,0,0,0.4); border-color: rgba(255, 255, 255, 0.7); }
        body.dark-mode .card:hover { border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 15px 35px rgba(0,0,0,0.8); }

        .card-img-top { height: 180px; object-fit: cover; border-bottom: 1px solid rgba(255, 255, 255, 0.2); }
        .card-title { font-weight: 700; font-size: 1.25rem; margin-bottom: 8px; }
        .card-text { color: rgba(255, 255, 255, 0.85); font-size: 0.95rem; line-height: 1.4; }
        .price { color: #4ade80; font-weight: 800; font-size: 1.35rem; text-shadow: 0 2px 10px rgba(74, 222, 128, 0.3); margin-top: 10px; }

        .card-list-view { flex-direction: row; align-items: stretch; }
        .card-list-view .card-img-top { width: 35%; height: 100%; min-height: 160px; border-bottom: none; border-right: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px 0 0 20px; }
        .card-list-view .card-body { width: 65%; padding: 15px 20px; }

        @media (max-width: 768px) {
            .card-list-view { flex-direction: column; }
            .card-list-view .card-img-top { width: 100%; height: 180px; border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px 20px 0 0; }
            .card-list-view .card-body { width: 100%; }
        }

        /* Shared Menu Styles */
        .menu-container, .simple-menu-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; }
        .ios-fab { width: 60px; height: 60px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 30px rgba(0,0,0,0.3); color: white; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        body.dark-mode .ios-fab { background: rgba(0, 0, 0, 0.5); border-color: rgba(255, 255, 255, 0.2); }
        .ios-fab:hover { transform: scale(1.1); background: rgba(255, 255, 255, 0.3); }
        .ios-menu-options { position: absolute; bottom: 75px; right: 0; background: rgba(40, 40, 40, 0.6); backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 5px; width: 220px; transform-origin: bottom right; transform: scale(0); opacity: 0; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        body.dark-mode .ios-menu-options { background: rgba(20, 20, 20, 0.9); border-color: rgba(255, 255, 255, 0.2); }
        .ios-menu-options.show { transform: scale(1); opacity: 1; }
        .ios-menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: white; text-decoration: none; border-radius: 12px; font-weight: 600; transition: background 0.2s ease; }
        .ios-menu-item:hover { background: rgba(255, 255, 255, 0.2); color: white; }
        .ios-menu-item.disabled { opacity: 0.4; pointer-events: none; cursor: not-allowed; }
        .simple-dropdown { position: absolute; bottom: 60px; right: 0; background: rgba(40, 40, 40, 0.8); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 15px; padding: 10px; width: 220px; display: flex; flex-direction: column; gap: 5px; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        body.dark-mode .simple-dropdown { background: rgba(20, 20, 20, 0.95); border-color: rgba(255, 255, 255, 0.2); }
        .simple-dropdown.show { opacity: 1; visibility: visible; bottom: 70px; }
        .btn-glass { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.4); color: white; font-weight: 600; border-radius: 12px; padding: 10px; transition: all 0.25s ease; backdrop-filter: blur(10px); font-size: 1rem; width: 100%; }
        body.dark-mode .btn-glass { background: rgba(0, 0, 0, 0.4); border-color: rgba(255, 255, 255, 0.2); }

        #toast-container { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); z-index: 10000; padding: 12px 24px; border-radius: 50px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1rem; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: top 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); }
        #toast-container.show { top: 30px; }
        .toast-success { background: rgba(34, 197, 94, 0.85); border: 1px solid rgba(255, 255, 255, 0.4); }
        .toast-error { background: rgba(239, 68, 68, 0.85); border: 1px solid rgba(255, 255, 255, 0.4); }
        .toast-icon { font-size: 1.2rem; }
    </style>
</head>
<body>

<div id="toast-container">
    <i id="toast-icon" class="bi bi-check-circle-fill toast-icon"></i>
    <span id="toast-message">Message here</span>
</div>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html">BadStore</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <input type="text" id="searchInput" class="search-bar d-none d-lg-block" placeholder="Tìm kiếm vợt..." onkeyup="handleSearch()">
            
            <div class="cart-container">
                <button class="cart-btn" onclick="window.location.href='checkout.html'">
                    <i class="bi bi-cart3 fs-5"></i>
                    <span class="cart-badge" id="cartCount">0</span>
                </button>
                
                <div class="cart-dropdown">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold m-0">Giỏ hàng của bạn</h6>
                        <button class="btn btn-sm btn-link text-danger text-decoration-none p-0" style="font-size: 0.85rem;" onclick="clearCart()">Xóa tất cả</button>
                    </div>
                    
                    <div id="cartItemsList" style="max-height: 280px; overflow-y: auto; padding-right: 5px;">
                        <p class="text-muted text-center" style="font-size: 0.85rem;">Chưa có sản phẩm nào.</p>
                    </div>
                    <div id="cartFooter" class="mt-3 d-none">
                        <div class="d-flex justify-content-between fw-bold mb-2">
                            <span>Tổng cộng:</span>
                            <span class="price" id="cartTotalPrice" style="font-size: 1.1rem;">0 VNĐ</span>
                        </div>
                        <button class="btn btn-success w-100 fw-bold" onclick="window.location.href='checkout.html'">Thanh toán</button>
                    </div>
                </div>
            </div>
            
            <span class="text-white d-none d-md-inline fw-bold" id="welcomeMessage"></span>
        </div>
    </div>
</nav>

<div class="container mt-5 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 style="font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.4); margin: 0;">Sản phẩm nổi bật</h2>
        <div class="view-toggle">
            <button id="btnGrid" class="active" onclick="setView('grid')"><i class="bi bi-grid-fill"></i></button>
            <button id="btnList" onclick="setView('list')"><i class="bi bi-list-ul"></i></button>
        </div>
    </div>
    <div class="row" id="productGrid"></div>
</div>

<!-- SHARED MENU -->
<div class="menu-container" id="iosMenuContainer">
    <div class="ios-menu-options" id="iosMenuOptions">
        <a href="index.html" class="ios-menu-item" id="navHome"><i class="bi bi-house-door-fill"></i> Trang chủ</a>
        <a href="checkout.html" class="ios-menu-item"><i class="bi bi-credit-card-fill"></i> Thanh toán</a>
        <a href="order-history.html" class="ios-menu-item"><i class="bi bi-clock-history"></i> Lịch sử đơn</a>
        <a href="#" class="ios-menu-item text-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Đăng xuất</a>
        <div style="height: 1px; background: rgba(255,255,255,0.2); margin: 5px 0;"></div>
        <a href="#" class="ios-menu-item text-warning" onclick="toggleDarkMode()"><i class="bi bi-moon-stars-fill" id="darkModeIcon"></i> <span id="darkModeText">Giao diện Tối</span></a>
        <a href="#" class="ios-menu-item text-info" onclick="toggleMenuMode()"><i class="bi bi-arrow-repeat"></i> Đổi kiểu Menu</a>
    </div>
    <button class="ios-fab" onclick="toggleMenu()"><i class="bi bi-grid-3x3-gap-fill"></i></button>
</div>

<div class="simple-menu-container d-none" id="simpleMenuContainer">
    <div class="simple-dropdown" id="simpleDropdown">
        <a href="index.html" class="ios-menu-item" id="simpleNavHome"><i class="bi bi-house-door-fill"></i> Trang chủ</a>
        <a href="checkout.html" class="ios-menu-item"><i class="bi bi-credit-card-fill"></i> Thanh toán</a>
        <a href="order-history.html" class="ios-menu-item"><i class="bi bi-clock-history"></i> Lịch sử đơn</a>
        <a href="#" class="ios-menu-item text-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Đăng xuất</a>
        <div style="height: 1px; background: rgba(255,255,255,0.2); margin: 5px 0;"></div>
        <a href="#" class="ios-menu-item text-warning" onclick="toggleDarkMode()"><i class="bi bi-moon-stars-fill" id="simpleDarkModeIcon"></i> <span id="simpleDarkModeText">Giao diện Tối</span></a>
        <a href="#" class="ios-menu-item text-info" onclick="toggleMenuMode()"><i class="bi bi-arrow-repeat"></i> Đổi kiểu Menu</a>
    </div>
    <button class="btn btn-glass px-4 py-2 fw-bold" onclick="toggleSimpleMenu()"><i class="bi bi-list me-2"></i> Menu</button>
</div>

<script>
    const loggedInUser = JSON.parse(localStorage.getItem('loggedInUser'));
    if (!loggedInUser) {
        window.location.href = 'login.html';
    } else {
        document.getElementById('welcomeMessage').innerText = `Xin chào, ${loggedInUser.userName}`;
        document.getElementById('navHome').classList.add('disabled');
        document.getElementById('simpleNavHome').classList.add('disabled');
    }

    let menuMode = localStorage.getItem('menuMode') || 'ios';
    if (menuMode === 'simple') {
        document.getElementById('iosMenuContainer').classList.add('d-none');
        document.getElementById('simpleMenuContainer').classList.remove('d-none');
    }

    let isDarkMode = localStorage.getItem('darkMode');
    if (isDarkMode === null) {
        isDarkMode = true;
        localStorage.setItem('darkMode', 'true');
    } else {
        isDarkMode = isDarkMode === 'true';
    }

    if (isDarkMode) {
        document.body.classList.add('dark-mode');
        updateDarkModeUI(true);
    }

    function toggleDarkMode() {
        isDarkMode = !isDarkMode;
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', isDarkMode);
        updateDarkModeUI(isDarkMode);
    }

    function updateDarkModeUI(isDark) {
        const iconClass = isDark ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
        const text = isDark ? 'Giao diện Sáng' : 'Giao diện Tối';
        document.getElementById('darkModeIcon').className = iconClass;
        document.getElementById('darkModeText').innerText = text;
        document.getElementById('simpleDarkModeIcon').className = iconClass;
        document.getElementById('simpleDarkModeText').innerText = text;
    }

    function toggleMenu() { document.getElementById('iosMenuOptions').classList.toggle('show'); }
    function toggleSimpleMenu() { document.getElementById('simpleDropdown').classList.toggle('show'); }
    function toggleMenuMode() {
        localStorage.setItem('menuMode', menuMode === 'ios' ? 'simple' : 'ios');
        window.location.reload();
    }

    function logout() {
        localStorage.removeItem('loggedInUser');
        window.location.href = 'login.html';
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        document.getElementById('toast-message').innerText = message;
        if (type === 'success') {
            container.className = 'toast-success'; 
            document.getElementById('toast-icon').className = 'bi bi-check-circle-fill toast-icon';
        } else {
            container.className = 'toast-error'; 
            document.getElementById('toast-icon').className = 'bi bi-x-circle-fill toast-icon';
        }
        setTimeout(() => container.classList.add('show'), 10);
        setTimeout(() => container.classList.remove('show'), 3000);
    }

    let products = [];
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let currentView = 'grid';

    async function fetchProducts() {
        try {
            const response = await fetch('http://localhost:8080/product/getAll');
            const data = await response.json();
            
            products = data.map(item => ({
                id: item.id,
                name: item.productName,
                price: item.productPrice,
                desc: "Sản phẩm chính hãng chất lượng cao.",
                image: `https://placehold.co/400x300/212529/FFF?text=${encodeURIComponent(item.productName)}`
            }));
            
            renderProducts(products);
            updateCartUI(); 
        } catch (error) {
            showToast("Lỗi kết nối máy chủ. Không thể tải sản phẩm!", 'error');
        }
    }

    function setView(view) {
        currentView = view;
        document.getElementById('btnGrid').classList.remove('active');
        document.getElementById('btnList').classList.remove('active');
        document.getElementById(view === 'grid' ? 'btnGrid' : 'btnList').classList.add('active');
        handleSearch();
    }

    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = products.filter(p => p.name.toLowerCase().includes(query));
        renderProducts(filtered);
    }

    function renderProducts(items) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';
        
        items.forEach(product => {
            if (currentView === 'grid') {
                grid.innerHTML += `
                    <div class="col-lg-3 col-md-6 mb-4">
                    <div class="card" onclick="window.location.href='product-detail.html?id=${product.id}'">
                            <img src="${product.image}" class="card-img-top" alt="${product.name}">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${product.name}</h5>
                                <p class="card-text mt-2">${product.desc}</p>
                                <p class="price mt-auto">${product.price.toLocaleString('vi-VN')} VNĐ</p>
                            </div>
                        </div>
                    </div>`;
            } else {
                grid.innerHTML += `
                    <div class="col-lg-6 col-md-12 mb-4">
                        <div class="card card-list-view" onclick="window.location.href='product-detail.html?id=${product.id}'">
                            <img src="${product.image}" class="card-img-top" alt="${product.name}">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${product.name}</h5>
                                <p class="card-text mt-1 mb-2">${product.desc}</p>
                                <p class="price mt-auto">${product.price.toLocaleString('vi-VN')} VNĐ</p>
                            </div>
                        </div>
                    </div>`;
            }
        });
    }

    function getCartTotalItems() { return cart.reduce((sum, item) => sum + item.quantity, 0); }

    function updateQuantity(productId, change) {
        const itemIndex = cart.findIndex(item => item.id === productId);
        if (itemIndex > -1) {
            const item = cart[itemIndex];
      
            if (change > 0 && getCartTotalItems() >= 20) {
                showToast(`Giỏ hàng chỉ được chứa tối đa 20 sản phẩm!`, 'error');
                return;
            }

            if (change > 0 && item.stockQuantity && item.quantity + change > item.stockQuantity) {
                showToast(`Chỉ còn ${item.stockQuantity} sản phẩm trong kho!`, 'error');
                return;
            }

            item.quantity += change;
            if (item.quantity <= 0) {
                cart.splice(itemIndex, 1);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }
    }

    function removeFromCart(productId) {
        cart = cart.filter(item => String(item.id) !== String(productId));
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartUI();
        showToast("Đã xóa sản phẩm khỏi giỏ hàng!", 'success');
    }

    function clearCart() {
        if (cart.length === 0) return;
        cart = [];
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartUI();
        showToast("Đã xóa toàn bộ giỏ hàng!", 'success');
    }

    function updateCartUI() {
        const cartCount = document.getElementById('cartCount');
        const cartItemsList = document.getElementById('cartItemsList');
        const cartFooter = document.getElementById('cartFooter');
        const cartTotalPrice = document.getElementById('cartTotalPrice');
        
        let totalItems = 0;
        let totalPrice = 0;
        
        cartItemsList.innerHTML = '';
        
        if (cart.length === 0) {
            cartItemsList.innerHTML = '<p class="text-muted text-center" style="font-size: 0.85rem;">Chưa có sản phẩm nào.</p>';
            cartFooter.classList.add('d-none');
        } else {
            cartFooter.classList.remove('d-none');
            cart.forEach(item => {
                totalItems += item.quantity;
                totalPrice += item.price * item.quantity;
                
                const variantHtml = item.variant && item.variant !== "Mặc định" ? `<p class="cart-item-variant">${item.variant}</p>` : '';

                cartItemsList.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-left">
                            <img src="${item.image}" class="cart-item-img">
                            <div>
                                <p class="cart-item-title">${item.name}</p>
                                ${variantHtml}
                                <p class="cart-item-price">${item.price.toLocaleString('vi-VN')} VNĐ</p>
                            </div>
                        </div>
                        <div class="d-flex align-items-center">
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="updateQuantity('${item.id}', -1)">-</button>
                                <span class="qty-display">${item.quantity}</span>
                                <button class="qty-btn" onclick="updateQuantity('${item.id}', 1)">+</button>
                            </div>
                            <button class="btn-remove-item" onclick="removeFromCart('${item.id}')" title="Xóa sản phẩm này"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }
        
        cartCount.innerText = totalItems;
        cartTotalPrice.innerText = `${totalPrice.toLocaleString('vi-VN')} VNĐ`;
    }

    fetchProducts();
</script>
</body>
</html>
